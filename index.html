<!DOCTYPE html>
<html lang="es" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maison Luxury | Perfumería</title>
    <meta name="theme-color" content="#101012" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="luxury-bg text-light">
    <script>
      try { const claro = localStorage.getItem("ml-tema-v1") === "claro"; document.body.classList.toggle("modo-claro", claro); document.documentElement.dataset.bsTheme = claro ? "light" : "dark"; document.documentElement.style.colorScheme = claro ? "light" : "dark"; } catch {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
