spring.application.name=ms-ordenes
server.port=${PORT:8083}

# Las fechas se guardan en UTC (serverTimezone y jdbc.time_zone deben coincidir)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/luxury_ordenes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# El esquema lo crea backend/database/04-schema-ordenes.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null

# Migraciones automáticas. Para bases ya pobladas, registrar migraciones históricas sin volver a ejecutarlas.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Gmail SMTP predeterminado. El envio solo se habilita al proporcionar credenciales en el lanzador.
luxury.mail.enabled=${MAIL_ENABLED:false}
luxury.mail.from=${MAIL_FROM:}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Documentación OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
