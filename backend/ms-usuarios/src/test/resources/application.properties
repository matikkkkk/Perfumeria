spring.application.name=ms-usuarios-test
spring.datasource.url=jdbc:h2:mem:usuarios;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
luxury.seed.usuarios=false

# JUnit usa H2 y Hibernate create-drop, no Flyway.
spring.flyway.enabled=false

# Configuracion aislada para pruebas: no requiere credenciales externas.
luxury.google.client-id=test-client-id
spring.mail.host=localhost
spring.mail.port=3025
luxury.mail.enabled=false
