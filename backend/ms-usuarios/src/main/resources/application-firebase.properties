spring.datasource.url=${MAISON_PG_URL}
spring.datasource.username=${MAISON_PG_USER}
spring.datasource.password=${MAISON_PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=maison_usuarios
spring.datasource.hikari.connection-init-sql=SET search_path TO maison_usuarios
spring.flyway.schemas=maison_usuarios
spring.flyway.default-schema=maison_usuarios
spring.flyway.locations=classpath:db/firebase
spring.h2.console.enabled=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
