spring.application.name=ms-usuarios
server.port=${PORT:8082}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/luxury_usuarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# El esquema lo crea backend/database/03-schema-usuarios.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

# Crea los 3 usuarios demo (admin, vendedor, cliente) si la tabla está vacía
luxury.seed.usuarios=${SEED_USUARIOS:true}

# Migraciones automáticas. Para bases ya pobladas, registrar migraciones históricas sin volver a ejecutarlas.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Correo de bienvenida: inactivo por defecto, mismas variables Gmail del lanzador.
luxury.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
luxury.mail.from=${MAIL_FROM:${SMTP_USER:}}

# Documentación OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Verificación de Google ID tokens (mismo Client ID del frontend)
luxury.google.client-id=${GOOGLE_CLIENT_ID:192171585366-1r6jcddvtt445osv8h2ef6lqvde36b41.apps.googleusercontent.com}
