        <main class="col-md-9 col-lg-10 p-4 p-md-5">

<h1 class="display-5 luxury-title">Nuevo usuario</h1>
<p class="text-gold-light">Crear usuario y asignar perfil.</p>
<form id="usuarioAdminForm" class="luxury-card p-4 mt-4">
<input type="hidden" name="runOriginal">
<div class="row g-3">
<div class="col-md-4"><label class="form-label-luxury">RUN</label><input name="run" class="form-control form-luxury" maxlength="9" required></div>
<div class="col-md-4"><label class="form-label-luxury">Nombre</label><input name="nombre" class="form-control form-luxury" maxlength="50" required></div>
<div class="col-md-4"><label class="form-label-luxury">Apellidos</label><input name="apellidos" class="form-control form-luxury" maxlength="100" required></div>
<div class="col-md-6"><label class="form-label-luxury">Correo</label><input name="correo" type="email" class="form-control form-luxury" maxlength="100" required></div>
<div class="col-md-6"><label class="form-label-luxury">Fecha nacimiento</label><input name="fechaNacimiento" type="date" class="form-control form-luxury"></div>
<div class="col-md-4"><label class="form-label-luxury">Tipo de usuario</label><select name="tipo" class="form-select form-luxury"><option>Administrador</option><option>Cliente</option><option>Vendedor</option></select></div>
<div class="col-md-4"><label class="form-label-luxury">Región</label><select name="region" id="region" class="form-select form-luxury" required></select></div>
<div class="col-md-4"><label class="form-label-luxury">Comuna</label><select name="comuna" id="comuna" class="form-select form-luxury" required></select></div>
<div class="col-12"><label class="form-label-luxury">Dirección</label><input name="direccion" class="form-control form-luxury" maxlength="300" required></div>
<div class="col-12 text-center mt-4"><button class="btn btn-luxury px-5" type="submit">Guardar usuario</button></div>
</div>
</form>

        </main>
    </div>
</div>
