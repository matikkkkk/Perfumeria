<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Luxury Admin — Inicio</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body class="luxury-bg text-light">
        <header>
            <nav class="navbar navbar-dark bg-transparent py-3 border-bottom border-secondary border-opacity-25">
                <div class="container">
                    <a class="navbar-brand brand-logo" href="index.html">LUXURY ADMIN</a>
                    <a class="btn btn-luxury" href="../index.html">Tienda</a>
                </div>
            </nav>
        </header>
        <div class="container-fluid">
            <div class="row">
                <aside class="col-md-3 col-lg-2 admin-menu py-4">
                    <a href="index.html">Inicio</a>
                    <a href="productos.html">Productos</a>
                    <a href="nuevo-producto.html">Nuevo producto</a>
                    <a href="usuarios.html">Usuarios</a>
                    <a href="nuevo-usuario.html">Nuevo usuario</a>
                    <a href="ordenes.html">Órdenes</a>
                    <a href="../login.html">Cerrar sesión</a>
                </aside>
                <main class="col-md-9 col-lg-10 p-4 p-md-5">
                    <h1 class="display-5 luxury-title">Panel principal</h1>
                    <p class="text-gold-light">Bienvenido al sistema administrativo de LUXURY.</p>
                    <div class="row g-4 mt-3">
                        <div class="col-md-4">
                            <div class="stat-card">
                                <div class="stat-number" id="cantidadProductos">0</div>
                                <div>Productos</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="stat-card">
                                <div class="stat-number" id="cantidadUsuarios">0</div>
                                <div>Usuarios</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="stat-card">
                                <div class="stat-number" id="cantidadOrdenes">0</div>
                                <div>Órdenes</div>
                            </div>
                        </div>
                    </div>
                    <script>
                        document.addEventListener("DOMContentLoaded", function () {
                            document.getElementById("cantidadProductos").textContent = obtenerProductos().length;
                            document.getElementById("cantidadUsuarios").textContent = JSON.parse(
                                localStorage.getItem("usuarios") || "[]",
                            ).length;
                            document.getElementById("cantidadOrdenes").textContent = JSON.parse(
                                localStorage.getItem("ordenes") || "[]",
                            ).length;
                        });
                    </script>
                </main>
            </div>
        </div>
        <footer class="site-footer">
            <div class="container text-center">
                <span>© 2026 Luxury — Sistema administrativo</span>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../js/data.js"></script>
        <script src="../js/script.js"></script>
        <script src="../js/admin.js"></script>
    </body>
</html>
